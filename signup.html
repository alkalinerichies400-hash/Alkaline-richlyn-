<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<style>
body{margin:0;font-family:Arial;background:#0b0b0b;display:flex;justify-content:center;align-items:center;height:100vh;color:white;}
.box{background:#151515;padding:35px;width:350px;border-radius:12px;border:1px solid gold;}
h2{text-align:center;color:gold;}
input{width:100%;padding:12px;margin:10px 0;border:none;border-radius:8px;}
button{width:100%;padding:12px;background:gold;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
a{display:block;text-align:center;color:gold;margin-top:15px;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<h2>Create Account</h2>
<form>
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email Address" required>
<input type="text" placeholder="Username" required>
<input type="password" placeholder="Password" required>
<input type="password" placeholder="Confirm Password" required>
<button type="submit">Register</button>
</form>
<a href="login.html">Already have an account?</a>
</div>
</body>
</html>
