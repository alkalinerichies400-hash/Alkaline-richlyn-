<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Alkaline Richlyn</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.login-box{
background:#151515;
padding:40px;
width:320px;
border-radius:15px;
border:1px solid gold;
}

h2{
text-align:center;
color:gold;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:gold;
border:none;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
color:gold;
text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">
<h2>User Login</h2>

<form>
<input type="text" placeholder="Username" required>
<input type="password" placeholder="Password" required>

<button type="submit">Login</button>
</form>

<a href="index.html">Back Home</a>

</div>

</body>
</html>
